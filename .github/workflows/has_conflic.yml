name: Label merge conflicts

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  push:
    branches: [master]

permissions:
  contents: read
  pull-requests: write

jobs:
  conflicts:
    uses: andes/shared-workflows/.github/workflows/label-merge-conflicts.yml@v1
    with:
      label: has_conflicts
