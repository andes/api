name: BUILD AND TEST
on: [push]

permissions:
  contents: read

jobs:
  build:
    uses: andes/shared-workflows/.github/workflows/node-ci.yml@v1
    with:
      runner: ubuntu-22.04
      node-version: 22.x
      commands: |
        cp config.private.ts.example config.private.ts
        npm run lint
        NODE_OPTIONS=--max-old-space-size=4096 npm run tsc
        npm run test
