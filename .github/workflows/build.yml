name: BUILD AND TEST

# Apunta a la rama de desarrollo de shared-workflows.
# Pasa a @v1 cuando node-ci esté en ese tag.
on: [push]

permissions:
  contents: read

jobs:
  build:
    uses: andes/shared-workflows/.github/workflows/node-ci.yml@feat/api-wf
    with:
      runner: ubuntu-22.04
      node-version: 22.x
      commands: |
        cp config.private.ts.example config.private.ts
        npm run lint
        NODE_OPTIONS=--max-old-space-size=4096 npm run tsc
        npm run test
